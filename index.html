
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Paws - Puzzle Game</title>
  <meta name="description"
        content="Paws is a cozy mobile logic puzzle game. Find hidden paws using clues, arrows, and logic.">

  <link rel="icon" href="./assets/icon.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="hero">

    <!-- Left column -->
    <section class="content">
      <h1>Paws - Puzzle Game</h1>

      <p>
        Paws is a cozy mobile logic puzzle game about finding
        hidden paws. Use row and column clues, follow directional
        arrows, and solve each board using logic alone.
        No guessing required.
      </p>

      <div class="badges">

        <!-- App Store: no link until release -->
        <span class="badge"
              aria-label="Coming soon to the App Store"
              title="Coming soon">
          <img src="./assets/app-store.svg"
               alt="Download on the App Store">
        </span>

        <!-- GitHub repository -->
        <a class="badge"
           href="https://github.com/juarezweiss/Paws"
           target="_blank"
           rel="noopener noreferrer">
          <img src="./assets/github-badge.png"
               alt="View Paws on GitHub">
        </a>

      </div>
    </section>

    <!-- Right column -->
    <section class="preview" aria-label="Game preview">
      <div class="artwork">

        <div class="phone">
          <img src="./assets/board.png"
               alt="Paws game board">
        </div>

        <img class="app-icon"
             src="./assets/icon.png"
             alt="Paws app icon">

      </div>
    </section>

  </main>
</body>
</html>
